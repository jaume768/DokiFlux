name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 20
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 18m
          script: |
            set -e
            cd /opt/dokiflux

            # Handle divergent history (e.g., after force push) by resetting to origin
            git fetch origin main
            git reset --hard origin/main

            PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            CURR_SHA=$(git rev-parse HEAD)

            DC="docker compose -f docker-compose.prod.yml --env-file .env.production"

            # Detect which services actually changed
            CHANGED=$(git diff --name-only "$PREV_SHA" "$CURR_SHA")
            BUILD_FRONTEND=false
            BUILD_BACKEND=false

            echo "$CHANGED" | grep -q "^frontend/" && BUILD_FRONTEND=true || true
            echo "$CHANGED" | grep -q "^backend/" && BUILD_BACKEND=true || true
            # Rebuild all if compose/env/root config changed
            echo "$CHANGED" | grep -qE "^(docker-compose|\.env|Caddyfile)" && BUILD_FRONTEND=true && BUILD_BACKEND=true || true

            SERVICES=""
            if $BUILD_BACKEND; then
              SERVICES="$SERVICES backend celery_worker"
            fi
            if $BUILD_FRONTEND; then
              SERVICES="$SERVICES frontend"
            fi

            if [ -n "$SERVICES" ]; then
              echo "Building:$SERVICES"
              $DC build --parallel $SERVICES
            else
              echo "No service changes detected, skipping build."
            fi

            $DC up -d
            # The backend entrypoint already runs migrate, but we re-run it
            # explicitly here to catch any edge cases. If it fails because a
            # table already exists but the migration isn't recorded (common after
            # manual DB fixes), fake the specific migration and retry.
            if ! $DC exec -T backend python manage.py migrate --noinput 2>/tmp/migrate_err; then
              ERR=$(cat /tmp/migrate_err)
              if echo "$ERR" | grep -q "already exists" && echo "$ERR" | grep -q "project_export_logs"; then
                echo "Table project_export_logs exists but migration not recorded. Faking projects.0007..."
                $DC exec -T backend python manage.py migrate projects 0007 --fake || true
                $DC exec -T backend python manage.py migrate --noinput
              else
                echo "$ERR" >&2
                exit 1
              fi
            fi
            $DC exec -T backend python manage.py collectstatic --noinput
            docker image prune -f
            echo "Deploy completed at $(date)"
